<!-- expense-form.component.html -->
<form class="form-card" [formGroup]="form" (ngSubmit)="onSubmitExpense()">
  <button type="button" class="modal-close" (click)="closed.emit()">✕</button>

  <div class="expense-label">
    <label>EXPENSE</label>
  </div>

  <div class="form-header">
    <h2>Add Expense</h2>
    <p>Track where your money goes.</p>
  </div>

  <div class="field">
    <label for="amount">Amount</label>

    <input placeholder="0.00" id="amount" type="number" step="0.01" formControlName="amount" />

    <span
      class="error"
      [class.visible]="form.get('amount')?.invalid && form.get('amount')?.touched"
    >
      Amount is required
    </span>
  </div>

  <div class="field">
    <label for="category">Category</label>

    <select id="category" formControlName="category">
      <option value="" disabled>Select category</option>
      @for (cat of categories; track cat) {
        <option [value]="cat">{{ cat }}</option>
      }
    </select>
    <span
      class="error"
      [class.visible]="form.get('category')?.invalid && form.get('category')?.touched"
      >Category is required</span
    >
  </div>

  <div class="field">
    <label for="date">Date</label>

    <input id="date" type="date" formControlName="date" />
  </div>

  <div class="field">
    <label for="description">Description</label>

    <input placeholder="Description" id="description" type="text" formControlName="description" />

    <span class="error" [class.visible]="form.controls.description.hasError('maxlength')"
      >Description can't be more than 30 characters.</span
    >
  </div>
  <div>
    <button type="submit">Add Expense</button>
    <span class="error" [class.visible]="submitted && (form.get('amount')?.value ?? 0) > balance()"
      >Amount is higer than the balance</span
    >
  </div>
</form>
