<form class="form-card" [formGroup]="form" (ngSubmit)="onSubmitIncome()">
  <button type="button" class="modal-close" (click)="closed.emit()">✕</button>

  <div class="income-label">
    <label>INCOME</label>
  </div>

  <div class="form-header">
    <h2>Add Income</h2>
    <p>Record money you receive.</p>
  </div>
  <div class="field">
    <label for="income-amount">Amount</label>
    <input
      id="income-amount"
      type="number"
      step="0.01"
      formControlName="amount"
      placeholder="Amount"
    />
    <span class="error" [class.visible]="form.get('amount')?.invalid && form.get('amount')?.touched"
      >Amount is required</span
    >
  </div>

  <div class="field">
    <label for="income-source">Source</label>
    <input id="income-source" type="text" formControlName="source" placeholder="e.g. Salary" />
    <span class="error" [class.visible]="form.get('source')?.invalid && form.get('source')?.touched"
      >Source is required</span
    >
  </div>

  <div class="field">
    <label for="income-date">Date</label>
    <input id="income-date" type="date" formControlName="date" />
  </div>

  <div class="field">
    <label for="description">Description</label>

    <input
      placeholder="Description"
      id="income-description"
      type="text"
      formControlName="description"
    />
    <span class="error" [class.visible]="form.controls.description.hasError('maxlength')"
      >Description can't be more than 30 characters.</span
    >
  </div>

  <div>
    <button type="submit">Add Income</button>
  </div>
</form>
